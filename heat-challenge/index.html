@import url('https://fonts.googleapis.com/css2?family=Markazi+Text:wght@400;500;600;700&family=El+Messiri:wght@500;600;700&display=swap');
:root{--yellow:#ffe644;--pink:#ff7fb9;--aqua:#64e6df;--ink:#18252c;--bg:#ffe644}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:var(--bg);color:var(--ink);font-family:'Markazi Text',serif}button,input,select{font-family:'El Messiri',sans-serif}button{cursor:pointer}#app{height:100dvh;width:100vw;overflow:hidden}.screen{height:100%;display:flex;flex-direction:column;padding:clamp(8px,1.6vh,18px) clamp(10px,2vw,32px);gap:clamp(5px,1vh,12px);background:var(--bg)}.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px}.brand{font:700 clamp(16px,1.6vw,25px) 'El Messiri';white-space:nowrap}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.btn{border:2px solid var(--ink);border-radius:12px;background:#fff;padding:8px 13px;font:700 clamp(12px,1.1vw,17px) 'El Messiri';color:var(--ink)}.btn.primary{background:var(--ink);color:white}.btn:disabled{opacity:.35;cursor:not-allowed}.intro{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:2vh}.intro h1{font:700 clamp(40px,6vw,90px) 'El Messiri';margin:0}.intro p{font-size:clamp(24px,3vw,43px);margin:0}.modes{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:min(900px,100%)}.mode{border:3px solid var(--ink);border-radius:20px;min-height:135px;background:var(--pink);font:700 clamp(19px,2.4vw,33px) 'El Messiri';box-shadow:5px 5px 0 var(--ink)}.mode:nth-child(2){background:var(--aqua)}.mode small{display:block;font:500 clamp(15px,1.5vw,20px) 'Markazi Text'}.setup{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.setup label{display:grid;text-align:right;font:600 16px 'El Messiri'}.setup input,.setup select{padding:10px;border:2px solid;border-radius:10px;min-width:160px;background:#fff}.stage{flex:1;min-height:0;display:grid;grid-template-columns:clamp(100px,15vw,205px) minmax(0,1fr);gap:clamp(10px,2vw,28px);direction:rtl}.thermoPanel{grid-column:1;grid-row:1;background:#ffffffa8;border:2px solid #17252c;border-radius:22px;display:flex;align-items:center;justify-content:center;flex-direction:column;min-height:0;padding:8px;gap:5px}.thermoTitle{font:700 clamp(12px,1.2vw,18px) 'El Messiri';text-align:center}.tube{height:min(52vh,390px);width:clamp(48px,6vw,80px);position:relative;border:4px solid #26343b;border-radius:45px 45px 12px 12px;background:#fff;overflow:hidden}.liquid{position:absolute;bottom:0;right:0;left:0;background:linear-gradient(#ff82a9,#ff365e);transition:height .3s}.ticks{position:absolute;inset:6px 0;display:flex;flex-direction:column-reverse;justify-content:space-between;align-items:center}.tick{border-radius:30px;background:#fff9;width:70%;text-align:center;font:700 clamp(12px,1.4vw,19px) 'El Messiri';border:1px solid #0005;line-height:1.55}.tick.current{background:#18252c;color:white}.bulb{width:clamp(57px,7vw,93px);aspect-ratio:1;border:4px solid #26343b;border-radius:50%;background:#ff365e;margin-top:-22px;z-index:1}.progress{font:700 clamp(14px,1.4vw,19px) 'El Messiri';text-align:center}.content{grid-column:2;grid-row:1;min-width:0;min-height:0;display:flex;flex-direction:column;align-items:stretch;justify-content:stretch;gap:clamp(6px,1.2vh,15px)}.eyebrow{font:700 clamp(13px,1.3vw,19px) 'El Messiri';text-align:center}.question{font:700 clamp(28px,3.3vw,53px) 'Markazi Text';line-height:1.25;text-align:center;margin:0}.visualWrap{height:clamp(65px,18vh,170px);width:min(100%,500px);margin:0 auto}.visualWrap svg{height:100%;width:100%}.options{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(4,minmax(0,1fr));flex:1;min-height:0;gap:clamp(6px,1.1vh,12px)}.option{border:2px solid var(--ink);background:#fff;border-radius:16px;min-height:0;height:100%;padding:clamp(6px,1.2vw,17px);font:600 clamp(26px,2.8vw,46px) 'Markazi Text';text-align:right;line-height:1.15;color:var(--ink)}.option.correct{background:#75e6a1}.option.wrong{background:#ff99a0}.option:disabled{cursor:default .boardContent{justify-content:center;gap:1vh}.boardTitle{font:700 clamp(34px,4vw,64px) 'El Messiri',sans-serif;text-align:center;margin:0}.boardSub{font:600 clamp(23px,2.4vw,35px) 'Markazi Text',serif;text-align:center;margin:0 0 1vh}.cardDeck{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:clamp(10px,1.4vw,22px);padding:1vh 0 2vh}.scienceCard{position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:clamp(4px,1vh,12px);border:3px solid #203746;border-radius:18px;background:#fff;color:#203746;box-shadow:0 5px 0 #203746;font-family:'El Messiri',sans-serif;transition:transform .15s}.scienceCard:nth-child(4n+1){border-top:12px solid #e83b73}.scienceCard:nth-child(4n+2){border-top:12px solid #09a99f}.scienceCard:nth-child(4n+3){border-top:12px solid #8656cc}.scienceCard:nth-child(4n){border-top:12px solid #ed9b16}.scienceCard:hover{transform:translateY(-3px)}.scienceCard.done{background:#e6f5ef;border-color:#3b7b67;box-shadow:0 5px 0 #3b7b67}.cardSymbol{font:700 clamp(42px,5vw,88px) Arial,sans-serif;direction:ltr;line-height:1}.cardIndex{font-size:clamp(17px,1.5vw,25px);font-weight:700}.cardStatus{font-size:clamp(13px,1vw,17px);color:#46616c}.classThermo .progressCaption{font-size:clamp(13px,1.1vw,18px)}@media(max-width:850px){.cardDeck{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr))}.cardSymbol{font-size:clamp(22px,5vh,48px)}.cardIndex{font-size:clamp(13px,2vh,19px)}.cardStatus{font-size:12px}.boardTitle{font-size:clamp(23px,4vw,42px)}}
</style></head><body><main id="app"></main><script>
const questions=[
{q:"ماذا تقيس درجة الحرارة؟",o:["مجموع الطاقة الحركية للجسيمات","متوسط الطاقة الحركية للجسيمات","عدد جسيمات المادة","الطاقة الكامنة للجسيمات"],a:1,e:"درجة الحرارة مقياس لمتوسط الطاقة الحركية للذرات والجزيئات."},
{q:"إذا زاد متوسط الطاقة الحركية لجسيمات مادة، ماذا يحدث لدرجة حرارتها؟",o:["تنخفض","ترتفع","تبقى ثابتة","تصبح صفرًا"],a:1,e:"زيادة متوسط الطاقة الحركية تعني ارتفاع درجة الحرارة."},
{q:"تأمّلي الجسيمات في الجسمين A وB: أيهما أعلى درجة حرارة؟",o:["الجسم A","الجسم B","متساويان","لا يمكن المقارنة"],a:0,e:"جسيمات الجسم A أسرع في المتوسط، ولذلك متوسط طاقتها الحركية ودرجة حرارتها أعلى.",visual:"particles"},
{q:"ماذا تمثل الأجزاء 1 و2 و3 في الترمومتر على الترتيب؟",o:["الأنبوب الشعري – الجدار الفاصل – المستودع الزجاجي","المستودع الزجاجي – الأنبوب الشعري – الجدار الفاصل","الجدار الفاصل – المستودع الزجاجي – الأنبوب الشعري","الأنبوب الشعري – المستودع الزجاجي – الجدار الفاصل"],a:0,e:"1 الأنبوب الشعري، 2 الجدار الفاصل، 3 المستودع الزجاجي.",visual:"thermometer"},
{q:"أي مما يلي لا يمثل خاصية للسائل المستخدم في مقياس درجة الحرارة؟",o:["يتمدد وينكمش بانتظام مع تغير الحرارة","حساس للتغيرات الصغيرة في درجة الحرارة","درجة تجمده منخفضة وغليانه مرتفعة","يتمدد وينكمش بصورة غير منتظمة"],a:3,e:"السائل المناسب يتمدد وينكمش بانتظام تقريبًا، ويكون حساسًا، ويبقى سائلًا في مدى قياس واسع."},
{q:"لقياس درجات حرارة منخفضة جدًا، أي خاصية للسائل أهم؟",o:["درجة تجمد منخفضة","درجة غليان منخفضة","حساسية ضعيفة","تمدد غير منتظم"],a:0,e:"درجة التجمد المنخفضة تمنع تجمد السائل عند قياس البرودة الشديدة."},
{q:"لقياس درجة حرارة منخفضة جدًا، أي مقياس تختارين؟",o:["الزئبقي لأنه يقيس أدنى درجات الحرارة","الكحولي لأنه يبقى سائلًا عند درجات منخفضة جدًا","الزئبقي لأنه أكثر أمانًا","كلاهما مناسب دائمًا"],a:1,e:"الكحول الملون مناسب لدرجات الحرارة شديدة الانخفاض، كما أنه بديل أكثر أمانًا من الزئبق."},

];
const types=["تعريف أساسي","تنبؤ علمي","مقارنة الجسيمات","تركيب الترمومتر","اكتشفي الدخيل","خصائص السائل","الكحول أم الزئبق؟","مهارات عليا"];
const skills=["تعريف درجة الحرارة","الطاقة الحركية","المقارنة الجزيئية","مكونات الترمومتر","خصائص السائل","مدى القياس","مقارنة المقاييس","الضغط ودرجة الحرارة"];
const colors=["#F9EB38","#45E9D4","#FF8EC4","#B18AFF","#B4F34C","#FFB347","#FF82C0","#FF655B"];
const cheers=["🔥 أشعلي التحدي!","ارفعي طاقتك… المستوى الثاني!","راقبي الجسيمات… السر في الحركة!","فكّي شفرة الترمومتر!","هل تستطيعين اكتشاف الدخيل؟","أنتِ الآن مهندسة مقاييس!","اختيارك يحتاج إلى ذكاء!","🔥 السؤال الناري الأخير… إلى القمة!"];
function visual(q){if(q.visual==='particles')return `<div class="visualWrap"><svg viewBox="0 0 440 112" role="img" aria-label="جسم A حركة جسيماته أسرع من جسم B"><rect x="5" y="7" width="207" height="98" rx="14" fill="#fff9" stroke="#222" stroke-width="2"/><rect x="228" y="7" width="207" height="98" rx="14" fill="#fff9" stroke="#222" stroke-width="2"/><text x="108" y="24" text-anchor="middle" font-size="16" font-weight="bold">A — حركة أسرع</text><text x="330" y="24" text-anchor="middle" font-size="16" font-weight="bold">B — حركة أبطأ</text>${[0,1,2,3,4].map((n)=>`<circle cx="${34+n*35}" cy="60" r="8" fill="#ef633a"/><path d="M${45+n*35} 60 h17 l-5 -5 m5 5 l-5 5" fill="none" stroke="#d23b19" stroke-width="2"/>`).join('')}${[0,1,2,3,4].map(n=>`<circle cx="${255+n*35}" cy="60" r="8" fill="#299bce"/><path d="M${266+n*35} 60 h6 l-3 -3 m3 3 l-3 3" fill="none" stroke="#17628a" stroke-width="2"/>`).join('')}</svg></div>`;if(q.visual==='thermometer')return `<div class="visualWrap"><svg viewBox="0 0 440 180" role="img" aria-label="ترمومتر مرقم: 1 الأنبوب الشعري، 2 الجدار الفاصل، 3 المستودع الزجاجي"><rect x="204" y="8" width="24" height="138" rx="10" fill="#e8f8fc" stroke="#364b5c" stroke-width="3"/><rect x="213" y="15" width="6" height="129" rx="3" fill="#e94350"/><circle cx="216" cy="147" r="24" fill="#e94350" stroke="#364b5c" stroke-width="3"/>${[0,1,2,3,4,5].map(n=>`<path d="M230 ${25+n*18} h12" stroke="#364b5c" stroke-width="2"/>`).join('')}<path d="M218 42 H300 M204 93 H133 M216 151 H300" stroke="#222" stroke-width="2" fill="none"/>${[["1",317,42],["2",116,93],["3",317,151]].map(([t,x,y])=>`<circle cx="${x}" cy="${y}" r="17" fill="#111"/><text x="${x}" y="${y+6}" fill="white" text-anchor="middle" font-size="20" font-weight="bold">${t}</text>`).join('')}</svg></div>`;return ''}



const app=document.getElementById('app');let mode='',idx=0,score=0,answers=[],student='',section='',duration=20,left=20,timer=null,locked=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function stop(){clearInterval(timer);timer=null}function full(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.().catch(()=>{})}
function bar(extra=''){return `<header class="topbar"><div class="brand">🌡️ تحدّي عبقريات الحرارة</div><nav class="actions">${extra}<button class="btn" onclick="home()">⌂ الرئيسية</button><button class="btn" onclick="full()">⛶ ملء الشاشة</button></nav></header>`}
function frame(main,extra='',bottom=''){app.innerHTML=`<div class="screen">${bar(extra)}${main}<footer class="bottom"><span class="signature">إعداد معلمة الفيزياء حفصة طيبي</span><span class="counter">${bottom}</span></footer></div>`}
function home(){stop();document.documentElement.style.setProperty('--bg','#ffe644');frame(`<section class="intro"><h1>تحدّي عبقريات الحرارة</h1><p>تقييم تفاعلي في المفاهيم العلمية والتطبيق والاستدلال</p><div class="modes"><button class="mode" onclick="openMode('class')">🖥️ نسخة الصف<small>بدون مؤقت • شرح ومناقشة</small></button><button class="mode" onclick="openMode('student')">🎓 نسخة الطالبات<small>مؤقت • نقاط • شهادة</small></button></div></section>`)}
function openMode(m){mode=m;stop();frame(`<section class="intro"><h1>${m==='class'?'نسخة الصف':'نسخة الطالبات'}</h1><p>${m==='class'?'تقييم مفاهيمي تفاعلي في درجة الحرارة ومقاييسها':'تقييم فردي لقياس الفهم والتطبيق والاستدلال'}</p>${m==='student'?`<div class="setup"><label>اسم الطالبة<input id="nm" placeholder="الاسم الكامل"></label><label>الشعبة<select id="sec"><option value="">اختاري الشعبة</option>${[1,2,3,4,5,6].map(n=>`<option>عاشر ${n}</option>`).join('')}</select></label><label>زمن السؤال<select id="dur"><option value="15">15 ثانية</option><option value="20" selected>20 ثانية</option><option value="30">30 ثانية</option></select></label></div>`:''}<button class="btn primary" onclick="start()">ابدئي التحدّي ←</button></section>`)}
function start(){if(mode==='student'){student=document.getElementById('nm').value.trim();section=document.getElementById('sec').value;duration=Number(document.getElementById('dur').value);if(!student||!section){alert('أدخلي الاسم واختاري الشعبة');return}}idx=0;score=0;answers=[];if(mode==='class'){resetClass()}else render()}
function thermo(){const pct=(idx+1)/questions.length*100;return `<aside class="thermoPanel" aria-label="مؤشر تقدم الأسئلة"><div class="thermoTitle">مؤشر التقدّم</div><svg class="precisionThermo" viewBox="0 0 190 620" role="img" aria-label="ترمومتر بتدريج ثماني مراحل، المرحلة ${idx+1} من 8"><defs><linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d7f6ff"/><stop offset=".25" stop-color="#ffffff"/><stop offset=".72" stop-color="#f0faff"/><stop offset="1" stop-color="#a8d4e6"/></linearGradient><linearGradient id="mercury" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a40e32"/><stop offset=".33" stop-color="#ff476a"/><stop offset=".68" stop-color="#f7204d"/><stop offset="1" stop-color="#8f102c"/></linearGradient><linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#718f9f"/><stop offset=".5" stop-color="#273d4a"/><stop offset="1" stop-color="#7b98a8"/></linearGradient><clipPath id="columnClip"><rect x="75" y="30" width="34" height="462" rx="17"/></clipPath></defs><rect x="66" y="18" width="52" height="488" rx="26" fill="url(#glass)" stroke="url(#metal)" stroke-width="6"/><rect x="75" y="30" width="34" height="462" rx="17" fill="#fff" stroke="#8fb2c1" stroke-width="1"/><g clip-path="url(#columnClip)"><rect x="75" y="${492-462*pct/100}" width="34" height="${462*pct/100}" fill="url(#mercury)"/><path d="M83 42 V489" stroke="#ffffff" stroke-opacity=".65" stroke-width="5" stroke-linecap="round"/></g><circle cx="92" cy="529" r="66" fill="url(#glass)" stroke="url(#metal)" stroke-width="7"/><circle cx="92" cy="529" r="51" fill="url(#mercury)"/><ellipse cx="75" cy="510" rx="14" ry="24" fill="#fff" opacity=".25"/><g font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#243943">${Array.from({length:9},(_,i)=>{let y=491-i*57.5;return `<line x1="119" y1="${y}" x2="140" y2="${y}" stroke="#243943" stroke-width="2.5"/><text x="148" y="${y+6}">${i}</text>`}).join('')}${Array.from({length:32},(_,i)=>{let y=491-i*14.375;return `<line x1="119" y1="${y}" x2="${i%4===0?140:129}" y2="${y}" stroke="#526e7d" stroke-width="${i%4===0?2:1}"/>`}).join('')}</g><path d="M92 35V480" stroke="#fff" stroke-opacity=".18" stroke-width="2"/></svg><div class="progress"><strong>${idx+1}</strong> / ${questions.length}</div><div class="progressCaption">مراحل التقييم</div></aside>`}

/* لوحة اختيار حر للصف: ترتيب البطاقات يتغير عند بدء الجولة */
let deck=[],completed=new Set(),selectedCard=null;
function shuffleDeck(){deck=Array.from({length:questions.length},(_,i)=>i);for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}}
function classThermo(){let n=completed.size,pct=n/8*100;return `<aside class="thermoPanel classThermo" aria-label="مؤشر الإجابات المكتملة"><div class="thermoTitle">متابعة الأسئلة</div><svg class="precisionThermo" viewBox="0 0 190 620" role="img" aria-label="أُنجز ${n} من 8 أسئلة"><defs><linearGradient id="classGlass" x1="0" x2="1"><stop stop-color="#b2d7e6"/><stop offset=".4" stop-color="white"/><stop offset="1" stop-color="#b2d7e6"/></linearGradient><linearGradient id="classLiquid" x1="0" x2="1"><stop stop-color="#aa183c"/><stop offset=".45" stop-color="#ff315d"/><stop offset="1" stop-color="#9b1739"/></linearGradient><clipPath id="classClip"><rect x="75" y="30" width="34" height="462" rx="17"/></clipPath></defs><rect x="66" y="18" width="52" height="488" rx="26" fill="url(#classGlass)" stroke="#273d4a" stroke-width="6"/><rect x="75" y="30" width="34" height="462" rx="17" fill="#fff"/><g clip-path="url(#classClip)"><rect x="75" y="${492-462*pct/100}" width="34" height="${462*pct/100}" fill="url(#classLiquid)"/><path d="M83 36 V480" stroke="white" stroke-opacity=".55" stroke-width="5"/></g><circle cx="92" cy="529" r="66" fill="url(#classGlass)" stroke="#273d4a" stroke-width="7"/><circle cx="92" cy="529" r="51" fill="url(#classLiquid)"/>${Array.from({length:33},(_,i)=>{let y=491-i*14.375;return `<path d="M119 ${y} h${i%4===0?24:10}" stroke="#334f60" stroke-width="${i%4===0?2.5:1}"/>`}).join('')}<g aria-label="حالة الأسئلة">${Array.from({length:8},(_,i)=>{const y=491-(i+1)*57.5;const done=completed.has(i);const active=selectedCard===i;return `<g><circle cx="158" cy="${y}" r="${active?18:15}" fill="${done?'#e7f8ef':active?'#fff0b4':'#ffffff'}" stroke="${done?'#168454':active?'#d09b17':'#496272'}" stroke-width="${active?3:1.7}"/><text x="158" y="${y+5}" text-anchor="middle" font-family="Arial,sans-serif" font-size="${done?19:16}" font-weight="bold" fill="${done?'#13754b':'#233d4b'}">${done?'×':i+1}</text>${done?`<text x="184" y="${y+5}" text-anchor="end" font-family="Arial,sans-serif" font-size="10" fill="#13754b">${i+1}</text>`:''}</g>`}).join('')}</g></svg><div class="progress">${n} / 8</div><div class="progressCaption">أسئلة مكتملة</div><div class="progressCaption">${selectedCard===null?'اختاري إحدى البطاقات':'السؤال '+(selectedCard+1)}</div></aside>`}
function classBoard(){stop();selectedCard=null;document.documentElement.style.setProperty('--bg','#f5f8f9');frame(`<section class="stage">${classThermo()}<div class="content boardContent"><h1 class="boardTitle">اختاري بطاقة التحدّي</h1><p class="boardSub">ثماني بطاقات علمية · اختيار حر</p><div class="cardDeck">${deck.map((id,slot)=>`<button class="scienceCard ${completed.has(id)?'done':''}" onclick="openCard(${id})" aria-label="البطاقة ${slot+1} ${completed.has(id)?'مكتملة':''}"><span class="cardSymbol">${['°C','K','ΔT','T','°F','↗','∿','θ'][slot]}</span><span class="cardIndex">بطاقة ${String(slot+1).padStart(2,'0')}</span>${completed.has(id)?'<span class="cardStatus">✓ تمت الإجابة</span>':'<span class="cardStatus">اكشفي السؤال</span>'}</button>`).join('')}</div></div></section>`,`<button class="btn" onclick="resetClass()">جولة جديدة</button>`,`${completed.size} من 8 أسئلة`)}
function resetClass(){completed=new Set();shuffleDeck();classBoard()}
function openCard(id){selectedCard=id;idx=id;locked=false;document.documentElement.style.setProperty('--bg','#f5f8f9');const q=questions[id];frame(`<section class="stage">${classThermo()}<div class="content"><div class="eyebrow">${esc(types[id])}</div><div class="questionFrame"><span class="questionNumber">${String(id+1).padStart(2,'0')}</span><h2 class="question">${esc(q.q)}</h2></div>${visual(q)}<div class="options">${q.o.map((o,i)=>`<button class="option" id="opt${i}" onclick="chooseClass(${i})"><b>${'ABCD'[i]} — </b>${esc(o)}</button>`).join('')}</div><div class="feedback hidden" id="feedback"></div></div></section>`,`<button class="btn" onclick="classBoard()">↩ البطاقات</button><button class="btn primary" onclick="chooseClass(null)">كشف الإجابة</button>`,`السؤال ${id+1} من 8`);if(completed.has(id))chooseClass(null)}
function chooseClass(i){const q=questions[idx];if(locked)return;locked=true;completed.add(idx);q.o.forEach((_,j)=>{let el=document.getElementById('opt'+j);el.disabled=true;if(j===q.a)el.classList.add('correct');else if(j===i)el.classList.add('wrong')});let f=document.getElementById('feedback');f.classList.remove('hidden');f.innerHTML=`<b>الإجابة الصحيحة: ${esc(q.o[q.a])}</b> — ${esc(q.e)} <button class="btn primary" onclick="classBoard()">العودة إلى البطاقات</button>`;document.querySelector('.classThermo').outerHTML=classThermo();document.querySelector('.counter').textContent=`${completed.size} من 8 أسئلة مكتملة`}
function render(){stop();locked=false;document.documentElement.style.setProperty('--bg',colors[idx]);const q=questions[idx];left=duration;const controls=mode==='class'?`<button class="btn" onclick="previous()" ${idx===0?'disabled':''}>السابق</button><button class="btn primary" onclick="reveal()">كشف الإجابة</button><button class="btn primary" onclick="next()">${idx===7?'إنهاء':'التالي ←'}</button>`:`<span class="clock" id="clock">${left}</span>`;frame(`<section class="stage">${thermo()}<div class="content"><div class="eyebrow">${esc(types[idx])}</div><div class="questionFrame"><span class="questionNumber">${String(idx+1).padStart(2,'0')}</span><h2 class="question">${esc(q.q)}</h2></div>${visual(q)}<div class="options">${q.o.map((o,i)=>`<button class="option" id="opt${i}" onclick="choose(${i})"><b>${'ABCD'[i]} — </b>${esc(o)}</button>`).join('')}</div><div class="feedback hidden" id="feedback"></div></div></section>`,controls,mode==='student'?`النتيجة الحالية: ${score} / 8`:'ناقشي الإجابة ثم اكشفي التفسير');if(mode==='student')timer=setInterval(()=>{left--;let e=document.getElementById('clock');if(e)e.textContent=Math.max(0,left);if(left<=0)choose(null)},1000)}
function reveal(){choose(null)}function choose(i){if(locked)return;locked=true;stop();let q=questions[idx],correct=i===q.a;if(mode==='student'){answers.push({index:idx,selected:i,correct});if(correct)score++}q.o.forEach((_,j)=>{const el=document.getElementById('opt'+j);el.disabled=true;if(j===q.a)el.classList.add('correct');else if(j===i)el.classList.add('wrong')});let f=document.getElementById('feedback');f.classList.remove('hidden');f.innerHTML=`${mode==='class'?'الإجابة الصحيحة':correct?'✓ إجابة صحيحة':i===null?'انتهى الوقت':'الإجابة الصحيحة'}: <b>${esc(q.o[q.a])}</b> — ${esc(q.e)}`;if(mode==='student'){const b=document.createElement('button');b.className='btn primary';b.textContent=idx===7?'عرض النتيجة':'السؤال التالي ←';b.onclick=next;f.append(' ',b)}}
function next(){if(idx===7){if(mode==='class')finishClass();else results();return}idx++;render()}function previous(){if(idx>0){idx--;render()}}
function finishClass(){stop();frame(`<section class="intro"><h1>أحسنتنّ يا عبقريات الحرارة! 🌡️</h1><p>اكتمل التحدّي الصفي بجميع أسئلته الثمانية.</p><button class="btn primary" onclick="start()">إعادة التحدّي</button></section>`)}
function results(){stop();document.documentElement.style.setProperty('--bg','#ffe644');frame(`<section class="result"><h2>نتيجة تحدّي عبقريات الحرارة</h2><p style="text-align:center">${esc(student)} — ${esc(section)}<br>الدرجة: <b>${score} / 8</b> (${Math.round(score/8*100)}%)</p><div class="certificate"><h2>شهادة مشاركة</h2><p>تُمنح للطالبة <b>${esc(student)}</b> لمشاركتها في تحدّي عبقريات الحرارة</p><p>إعداد معلمة الفيزياء حفصة طيبي</p></div><h3>مراجعة الإجابات</h3>${answers.map(a=>`<div class="review"><b>${a.index+1}. ${esc(questions[a.index].q)}</b><div>${a.correct?'✓ صحيحة':'✗ غير صحيحة'} — ${esc(questions[a.index].o[questions[a.index].a])}</div><div>${esc(questions[a.index].e)}</div></div>`).join('')}<button class="btn primary" onclick="window.print()">طباعة التقرير والشهادة</button><button class="btn" onclick="home()">الرئيسية</button></section>`)}
home();
</script></body></html>
